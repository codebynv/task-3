name: Bug report
description: Report a verification workflow issue
title: "[Bug]: "
labels: ["bug"]
body:
  - type: textarea
    id: summary
    attributes:
      label: Summary
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected verification behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual result
      description: Do not attach private identity data or secrets.
    validations:
      required: false
